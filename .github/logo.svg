<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Lazy sunset — nvim-config</title>
  <defs>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <clipPath id="icon">
      <rect width="512" height="512" rx="118"/>
    </clipPath>
  </defs>
  <g clip-path="url(#icon)">
    <rect width="512" height="512" fill="url(#sunset)"/>
    <circle cx="256" cy="208" r="135" fill="#FFEDD5" opacity="0.18"/>
    <circle cx="256" cy="208" r="95" fill="#FFEDD5"/>
    <rect x="276" y="282" width="34" height="96" rx="17" fill="#FFEDD5"/>
    <circle cx="293" cy="414" r="16" fill="#FFEDD5"/>
  </g>
</svg>
